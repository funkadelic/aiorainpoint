name: Docs
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Strict, so a docstring that breaks the reference fails the pull request.
  # On main it also commits the dev version to a local gh-pages and hands it on
  # as a bundle, so no job that runs the docs toolchain holds a write token.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install the docs toolchain
        run: uv pip install --system -r requirements-docs.txt

      - name: Build
        run: zensical build --strict

      - name: Commit the dev version
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin gh-pages:gh-pages || true
          mike deploy dev
          git bundle create "$RUNNER_TEMP/pages.bundle" gh-pages

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages
          path: ${{ runner.temp }}/pages.bundle
          if-no-files-found: error

  # Pushes the bundle. Runs no repository code and no docs toolchain.
  deploy-dev:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A newer dev deploy may replace a pending one. Releases deploy in their own group.
    concurrency:
      group: gh-pages-dev
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages

      - name: Push gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A slower run for an older commit must not overwrite a newer dev.
          if [ "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved past $GITHUB_SHA, so this dev build is not published."
            exit 0
          fi
          git init -q pages
          git -C pages fetch -q "$PWD/pages.bundle" gh-pages:gh-pages
          git -C pages -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/$GITHUB_REPOSITORY" gh-pages
