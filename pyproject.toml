[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiorainpoint"
version = "0.0.0"
description = "Async client for the RainPoint Smart+ cloud API"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.10",
    "paho-mqtt>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiorainpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--cov=aiorainpoint",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.ruff]
# The oldest Python this library supports, matching requires-python.
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["aiorainpoint"]
combine-as-imports = true
