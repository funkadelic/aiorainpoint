[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiorainpoint"
version = "0.3.0"
description = "Async client for the RainPoint Smart+ cloud API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.10",
    "paho-mqtt>=2.1.0",
]

[project.urls]
Source = "https://github.com/funkadelic/aiorainpoint"

[tool.hatch.build.targets.wheel]
packages = ["src/aiorainpoint"]

[dependency-groups]
# mutmut 4 may change the [tool.mutmut] format. Install requirements-test.txt alongside it.
mutation = ["mutmut>=3.8.1,<4"]

# Mutation testing, run by hand. --no-cov keeps the coverage gate from marking every mutant killed.
[tool.mutmut]
source_paths = ["src/aiorainpoint/"]
also_copy = ["tests/", "scripts/", "pyproject.toml"]
# Log calls test nothing but log text.
do_not_mutate_patterns = ['_LOGGER\.']
# A mutant that breaks a loop becomes a timeout, not a runaway.
timeout_multiplier = 5.0
on_dependency_change = "rerun"
# These read the source files themselves, which mutmut rewrites.
pytest_add_cli_args = [
    "--no-cov",
    "--deselect=tests/test_generic_decoder.py::TestAsciiFramingNonRegression::test_decoders_py_digest_is_pinned",
    "--deselect=tests/test_mqtt.py::TestPushDispatchNeverRunsOnPahoThread",
    # These inspect the package and class namespaces, which mutmut adds its own names to.
    "--deselect=tests/test_public_api.py::TestPublicNames::test_no_public_name_leaks_outside_all",
    "--deselect=tests/test_public_api.py::TestDocstrings::test_public_methods_of_exported_classes_have_docstrings",
]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--cov=aiorainpoint",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.ruff]
# The oldest Python this library supports, matching requires-python.
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["aiorainpoint"]
combine-as-imports = true

[tool.mypy]
# Default mode at the oldest supported Python.
python_version = "3.13"
files = ["src/aiorainpoint", "scripts", "tests"]

[tool.coverage.run]
relative_files = true

[tool.coverage.paths]
# Tests run against the installed copy; map its files back to src/ for the reports.
source = ["src/aiorainpoint/", "*/site-packages/aiorainpoint/"]

[tool.coverage.report]
# Holds on both Pythons, measured against the installed package.
fail_under = 100
