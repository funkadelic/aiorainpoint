site_name: aiorainpoint
site_description: Async client for the RainPoint Smart+ cloud API
site_url: https://funkadelic.github.io/aiorainpoint/
repo_url: https://github.com/funkadelic/aiorainpoint
repo_name: funkadelic/aiorainpoint

nav:
  - Home: index.md
  - API reference: reference.md

theme:
  name: material

markdown_extensions:
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.aiohttp.org/en/stable/objects.inv
          options:
            docstring_style: google
            show_source: false
            show_if_no_docstring: true
            filters: ["!^_"]
            show_root_heading: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

extra:
  version:
    provider: mike
    default: latest
