name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded pull request run. Every other run gets its own group,
# since a pending run in a shared group is replaced by the next one queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Each job id is a required status check on main, so these stay separate jobs
# and never a matrix, which would rename them and block every merge.
jobs:
  # Builds the sdist, then the wheel from it, and runs the suite against the
  # installed wheel from outside the checkout. The only job that catches a
  # packaging exclusion, since the data loaders degrade silently without files.
  wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Build the sdist and the wheel
        run: uv build

      - name: Check the archives
        run: python scripts/check_dist.py dist

      - name: Install the wheel into a clean venv
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl -r requirements-test.txt

      - name: Smoke-test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

      - name: Run the whole suite against the wheel
        run: |
          mkdir "$RUNNER_TEMP/wheel-run"
          cp -r tests scripts pyproject.toml "$RUNNER_TEMP/wheel-run/"
          cd "$RUNNER_TEMP/wheel-run"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest --no-cov --tb=short

  # Named for the tool so it never shares a check name with a PR-title lint job.
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      # The pre-commit hook rev is the one ruff pin, so the hook and this job never disagree.
      - name: Install ruff
        run: |
          uv pip install --system "ruff==$(sed -n '/ruff-pre-commit/{n;s/.*rev: v//p}' .pre-commit-config.yaml)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install the package and test dependencies
        run: uv pip install --system . -r requirements-test.txt

      - name: Type-check
        run: mypy

  # The requires-python floor and the declared dependency floors. Runs under the same 100% coverage gate.
  test-min:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install the package at its dependency floors
        run: |
          python -c 'import tomllib; print("\n".join(d.replace(">=", "==") for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]))' > "$RUNNER_TEMP/floors.txt"
          uv pip install --system . -r requirements-test.txt -c "$RUNNER_TEMP/floors.txt"

      - name: Run tests with pytest
        run: pytest --tb=short

  # Newest supported Python. Alone reports to Codecov and Sonar, so they report once.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install the package and test dependencies
        run: uv pip install --system . -r requirements-test.txt

      # legacy junit keeps file and line attributes, which Codecov Test Analytics needs.
      - name: Run tests with pytest
        run: pytest --cov-report=xml --junitxml=junit.xml -o junit_family=legacy --tb=short

      - name: Upload coverage to Codecov
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: >-
          !cancelled()
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      # Skip the scan when a pull request touches nothing Sonar reads. Pushes to
      # main always analyze so the new-code baseline stays current.
      - name: Check whether Sonar analysis is needed
        id: sonar
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
          && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request; analyzing to keep the main baseline current."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit $BASE_SHA unavailable; analyzing rather than guessing."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${BASE_SHA}...HEAD")
          if printf '%s\n' "$changed" \
            | grep -qE '^(src/aiorainpoint/|tests/|sonar-project\.properties$|pyproject\.toml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No analyzed sources changed; skipping Sonar."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan
        if: steps.sonar.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
