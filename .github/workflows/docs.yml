name: Docs
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Strict, so a docstring that breaks the reference fails the pull request.
  # A push to main also publishes the build as the dev version.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the release workflow, so two pushes to gh-pages never race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install the docs toolchain
        run: uv pip install --system -r requirements-docs.txt

      - name: Build
        run: zensical build --strict

      - name: Deploy dev
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin gh-pages:gh-pages || true
          mike deploy --push dev
