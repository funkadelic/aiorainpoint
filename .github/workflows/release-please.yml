name: Release Please

# One file on purpose: the PyPI and TestPyPI publisher records bind to this
# filename and to the pypi environment, and neither accepts a reusable workflow.
# There is no concurrency group, so a release run waiting on the pypi reviewer
# never cancels or queues a TestPyPI rehearsal dispatch.

on:
  push:
    branches:
      - main
  # A push event is not guaranteed to arrive. A dispatch with an empty ref
  # re-runs release-please alone and is the recovery path.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build and upload to TestPyPI. Leave empty for a normal release run.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Scoped to what release-please uses: contents for the version bump,
          # tag and release; pull-requests for the release PR and its labels.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Runs the repository's code and suite, so it holds no id-token permission.
  build:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.ref != '')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build the sdist and the wheel
        run: uv build

      - name: Check the archives
        run: python scripts/check_dist.py dist

      - name: Install the wheel into a clean venv
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl -r requirements-test.txt

      # EXPECTED_VERSION is empty on a dispatch, so only a release asserts the version.
      - name: Smoke-test the installed wheel
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" ${EXPECTED_VERSION:+"$EXPECTED_VERSION"}

      - name: Run the whole suite against the wheel
        run: |
          mkdir "$RUNNER_TEMP/wheel-run"
          cp -r tests scripts pyproject.toml "$RUNNER_TEMP/wheel-run/"
          cd "$RUNNER_TEMP/wheel-run"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest --no-cov --tb=short

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only the job that mints the OIDC token, and it runs no repository code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  # Publishes the reference for this release as its minor version and moves
  # latest to it. Patches overwrite their minor.
  docs:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Its own group, so a dev deploy queued behind it can never replace it. A
    # push that loses a race with a dev deploy fails and is re-run.
    concurrency:
      group: gh-pages-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install the docs toolchain
        run: uv pip install --system -r requirements-docs.txt

      # The token reaches git here only, after the toolchain is installed.
      - name: Deploy
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch --no-tags origin gh-pages:gh-pages || true
          mike deploy --push --update-aliases "${VERSION%.*}" latest
          mike set-default --push latest

  # Opens a draft pull request on the integration that moves its pin to the
  # version just uploaded. Runs no repository code and holds no GITHUB_TOKEN
  # permission: the App token below is its only credential.
  bump:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    # Queue rather than race, so two releases finishing together apply in order.
    concurrency:
      group: integration-pin-bump
      cancel-in-progress: false
    env:
      BRANCH: automated/aiorainpoint-bump
      PIN_FILE: custom_components/rainpoint/manifest.json

    steps:
      # A branch pushed with an App token raises workflow events, so the pull
      # request gets the integration's checks.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ha-rainpoint
          permission-contents: write
          permission-pull-requests: write

      # Credentials stay persisted because the push below uses them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/ha-rainpoint
          ref: main
          path: ha-rainpoint
          token: ${{ steps.app-token.outputs.token }}

      - name: Open or update the pin bump PR
        working-directory: ha-rainpoint
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}
          TARGET_REPO: ${{ github.repository_owner }}/ha-rainpoint
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::The release produced no version, so there is nothing to pin."
            exit 1
          fi
          # Also keeps any unexpected shape out of sed, git and gh.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$VERSION is not a final release, so no pin bump is opened."
            exit 0
          fi
          pin_of() { jq -r '.requirements[] | select(startswith("aiorainpoint==")) | sub("^aiorainpoint=="; "")'; }
          # Never move the pin to a version that is not newer than main's pin or
          # the open bump PR's pin.
          floors="$(pin_of < "$PIN_FILE")"
          number="$(gh pr list --repo "$TARGET_REPO" --head "$BRANCH" --state open --json number --jq '.[].number')"
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true
          if [ -n "$number" ] && git rev-parse --verify --quiet "refs/remotes/origin/${BRANCH}" >/dev/null; then
            floors="$floors $(git show "refs/remotes/origin/${BRANCH}:${PIN_FILE}" | pin_of)"
          fi
          # Numeric triple, with a pre-release floor ranking below its own X.Y.Z.
          # Any other pin shape fails the job rather than silently skipping the bump.
          newer="$(python3 -c 'import re,sys
          def k(v):
              m=re.fullmatch(r"(\d+)\.(\d+)\.(\d+)((?:a|b|rc)\d+)?",v)
              if not m: sys.exit(f"::error::Cannot compare {sys.argv[1]} with the pin {v}. Move the pin to X.Y.Z by hand.")
              return tuple(map(int,m.groups()[:3])),m[4] is None
          v,*fs=map(k,sys.argv[1:])
          print("yes" if all(v>f for f in fs) else "no")' "$VERSION" $floors)"
          if [ "$newer" != yes ]; then
            echo "::notice::$VERSION is not newer than $floors, so nothing is pushed."
            exit 0
          fi
          # Installers read the simple index, which lags the JSON API, so wait on it.
          listed=""
          for _ in $(seq 20); do
            if curl -fsS --max-time 20 -H 'Accept: application/vnd.pypi.simple.v1+json' https://pypi.org/simple/aiorainpoint/ | jq -e --arg v "$VERSION" '.versions | index($v)' > /dev/null; then
              listed=1
              break
            fi
            sleep 30
          done
          if [ -z "$listed" ]; then
            echo "::error::PyPI's index does not list aiorainpoint $VERSION yet. Re-run this job alone once it does."
            exit 1
          fi
          # PyPI caches the index for up to 600s per Accept variant, so outwait that.
          sleep 600
          sed -i -E "s/\"aiorainpoint==[^\"]*\"/\"aiorainpoint==${VERSION}\"/" "$PIN_FILE"
          test "$(git diff --numstat)" = "$(printf '1\t1\t%s' "$PIN_FILE")" || { echo "::error::The pin rewrite changed more than the pin line in $PIN_FILE"; exit 1; }
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "$PIN_FILE"
          git commit -q -m "fix(deps): bump aiorainpoint to $VERSION"
          # Same explicit lease as the catalog refresh: an absent branch leaves
          # the expectation empty, which git reads as "must not exist yet".
          expected="$(git rev-parse --verify --quiet "refs/remotes/origin/${BRANCH}" || true)"
          git push --force-with-lease="refs/heads/${BRANCH}:${expected}" origin "$BRANCH"
          printf '%s\n\n%s\n' "aiorainpoint $VERSION is on PyPI. This moves the integration's pin to it." "Release notes: $RELEASE_URL" > "$RUNNER_TEMP/bump-body.md"
          if [ -z "$number" ]; then
            gh pr create --repo "$TARGET_REPO" --draft --base main --head "$BRANCH" --title "fix(deps): bump aiorainpoint to $VERSION" --body-file "$RUNNER_TEMP/bump-body.md"
          else
            gh api -X PATCH "repos/$TARGET_REPO/pulls/$number" -f title="fix(deps): bump aiorainpoint to $VERSION" -F body=@"$RUNNER_TEMP/bump-body.md" > /dev/null
          fi
